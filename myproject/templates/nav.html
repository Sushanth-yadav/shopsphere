<nav>
    <style>
        /* NAVBAR CONTAINER */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #2874f0;
    padding: 12px 25px;
    color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    position: sticky;
    top: 0;
    z-index: 1000;
}

/* LOGO */
.logo h1 {
    margin: 0;
    font-size: 24px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: white;
}

/* LINKS CONTAINER */
.links {
    display: flex;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

/* NAV LINKS */
.links a {
    color: white;
    text-decoration: none;
    font-weight: 500;
    padding: 6px 10px;
    border-radius: 5px;
    transition: 0.3s;
}

.links a:hover {
    background: rgba(255,255,255,0.2);
}

/* SEARCH FORM */
.links form {
    display: flex;
    align-items: center;
    gap: 5px;
}

/* SEARCH INPUT */
.links input[type="text"] {
    padding: 6px 10px;
    border: none;
    border-radius: 4px;
    outline: none;
    width: 180px;
}

/* SEARCH BUTTON */
.links button {
    padding: 6px 10px;
    border: none;
    background: #ff9f00;
    color: white;
    border-radius: 4px;
    cursor: pointer;
    transition: 0.3s;
}

.links button:hover {
    background: #e68a00;
}

/* TRENDING + OFFERS BUTTONS */
.links input[type="submit"] {
    padding: 6px 12px;
    border: none;
    border-radius: 4px;
    background: white;
    color: #2874f0;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.links input[type="submit"]:hover {
    background: #f1f1f1;
}

/* RESPONSIVE */
@media (max-width: 768px) {
    nav {
        flex-direction: column;
        align-items: flex-start;
    }

    .links {
        width: 100%;
        margin-top: 10px;
    }

    .links input[type="text"] {
        width: 100%;
    }
}
    </style>
    <div class="logo">
        <h1>shopsphere</h1>
    </div>
    <div class="links">
        {%if home_nav%}
            <form action="">
                <input type="text" name="search" id="" placeholder="search">
                <button type="submit">search</button>
            </form>
            <form action="">
                <input type="submit" name="trend" value="trending">
            </form>
            <form action="">
                <input type="submit" name="offer" id="" value="offers">
            </form>
        {%endif%}
        {% if user.is_authenticated%}
        <a href="{% url 'home'%}">home({{cart_count}})</a>
        <a href="{%url 'cart' %}">cart({{cart_count}})</a>
        <a href="{%url 'logout_'%}">logout</a>
        <a href="{%url 'profile'%}">profile({{cart_count}})</a>
        {%else%}
         <a href="{% url 'home'%}">home</a>
        <a href="{% url 'login_'%}">login</a>
        <a href="">knowus</a>
        <a href="">support</a>
        {%endif%}
    </div>
</nav>
