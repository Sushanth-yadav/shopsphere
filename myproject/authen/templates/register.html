{%extends 'main.html'%}
{%block abc%}
<style>
    /* Page background */
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}

/* Form container styling (using center as wrapper) */
center {
    margin-top: 50px;
}

/* Title */
h2 {
    color: #333;
    margin-bottom: 20px;
}

/* Form box look */
form {
    display: inline-block;
    background: #ffffff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
    text-align: left;
    min-width: 320px;
}

/* Labels */
label {
    display: block;
    margin: 10px 0 5px;
    font-weight: bold;
    color: #555;
}

/* Inputs */
input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    box-sizing: border-box;
}

/* Focus effect */
input:focus {
    outline: none;
    border-color: #2874f0;
    box-shadow: 0 0 5px rgba(40,116,240,0.3);
}

/* Register button */
button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: #2874f0;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
}

button:hover {
    background: #1c5dc9;
}

/* Error messages */
h2[style] {
    color: red !important;
    font-size: 16px;
}

/* Link */
a {
    display: inline-block;
    margin-top: 15px;
    color: #2874f0;
    text-decoration: none;
    font-weight: bold;
}

a:hover {
    text-decoration: underline;
}
</style>
<center>
    <h2>register here</h2>
    <form action="" method="POST">
        {%csrf_token%}
        {%  if messages%}
            {% for i in messages%}
            <h2 style="color: red;">{{i}}</h2>
            {%endfor%}
        {%endif%}
        <label for="">firstname:</label>
        <input type="text" name="fname" id=""> <br><br>
        <label for="">lastname:</label>
        <input type="text" name="lname" id=""> <br><br>
        <label for="">email:</label>
        <input type="email" name="email" id=""> <br><br>
        <label for="">username:</label>
        <input type="text" name="uname" id=""> <br><br>
        <label for="">password:</label>
        <input type="password" name="pasw" id=""> <br><br>
        <button type="submit">register</button><br><br>
        <a href="{% url 'login_'%}">Already registered ??</a>
    </form>
</center>
{%endblock%}
