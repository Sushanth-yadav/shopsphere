{%extends 'main.html'%}
{%block abc%}
<style>
    /* Login Page */
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}

/* Login Container */
.login-container {
    width: 350px;
    margin: 80px auto;
    background: #ffffff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
}

/* Heading */
.login-container h2 {
    color: #333;
    margin-bottom: 25px;
}

/* Labels */
.login-container label {
    display: block;
    text-align: left;
    margin-bottom: 5px;
    font-weight: bold;
    color: #555;
}

/* Inputs */
.login-container input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-bottom: 15px;
    box-sizing: border-box;
    font-size: 15px;
}

.login-container input:focus {
    outline: none;
    border-color: #2874f0;
    box-shadow: 0 0 5px rgba(40, 116, 240, 0.3);
}

/* Login Button */
.login-btn {
    width: 100%;
    padding: 12px;
    background: #2874f0;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
}

.login-btn:hover {
    background: #1c5dc9;
}

/* Error Messages */
.message {
    color: red;
    margin-bottom: 15px;
    font-weight: bold;
}

/* Register Link */
.register-link {
    text-decoration: none;
    color: #2874f0;
    font-weight: bold;
}

.register-link:hover {
    text-decoration: underline;
}
</style>
<center>
    <div class="login-container">
    <h2 class="title">login page</h2>
    <form action="" method="POST">
        {%csrf_token%}
        {%  if messages%}
            {% for i in messages%}
            <h2 style="color: red;">{{i}}</h2>
            {%endfor%}
        {%endif%}
        <label for="">username:</label>
        <input type="text" name="uname" id=""> <br><br>
        <label for="">password:</label>
        <input type="password" name="pasw" id=""> <br><br>
        <button type="submit" class="login-btn">login</button><br><br>
    </form>
    <a href="{% url 'register'%}" class="register-link">New  user</a> <br><br>
    <a href="{% url 'forgot'%}"class="register-link">Forgot Password??</a>
    </div>
    
</center>
{%endblock%}
